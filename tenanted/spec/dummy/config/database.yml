# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  global:
    <<: *default
    database: storage/development.sqlite3
    migrations_paths: <%= Partitia::Support.migrations_paths[:global] %>
  tenant:
    <<: *default
    database: storage/development/%{tenant}.sqlite3
    migrations_paths: <%= Partitia::Support.migrations_paths[:tenant] %>
    tenanted: true

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  global:
    <<: *default
    database: storage/test.sqlite3
    migrations_paths: <%= Partitia::Support.migrations_paths[:global] %>
  tenant:
    <<: *default
    database: storage/test/%{tenant}.sqlite3
    migrations_paths: <%= Partitia::Support.migrations_paths[:tenant] %>
    tenanted: true

# SQLite writes to the local filesystem: storage/ must be a persistent volume.
production:
  global:
    <<: *default
    database: storage/production.sqlite3
    migrations_paths: <%= Partitia::Support.migrations_paths[:global] %>
  tenant:
    <<: *default
    database: storage/production/%{tenant}.sqlite3
    migrations_paths: <%= Partitia::Support.migrations_paths[:tenant] %>
    tenanted: true
