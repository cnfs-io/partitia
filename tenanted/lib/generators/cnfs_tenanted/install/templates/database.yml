# SQLite. Versions 3.8.0 and up are supported.
#
# Multi-tenant layout (cnfs_tenanted):
#   primary : TENANTED. One SQLite file per tenant (storage/tenants/%{tenant}.sqlite3).
#   global  : plain, untenanted. Holds the Tenant registry (storage/*_global.sqlite3).
#
# MIGRATION PATHS / IN-PLACE OPT-IN
#   By default this app is in COPY-IN mode: each database's migrations_paths is
#   just the host's own directory, and you copy engine migrations into the app.
#
#   To use the IN-PLACE strategy (engines' migrations read directly from the
#   gems, not copied), opt in by requiring the registry early — ABOVE
#   `Bundler.require` in config/application.rb:
#
#       require "cnfs_support/engine_migration_paths"
#
#   When opted in, the constant below is defined and engines have appended their
#   paths; the inspect lines pick them up. When not opted in, the constant is
#   undefined and only the host's own paths are used. (Rails evaluates this file
#   before initializers, so this must be a plain require, not a config setting.)
<%% if defined?(CnfsSupport::EngineMigrationPaths) %>
<%%   tenant_migration_paths = CnfsSupport::EngineMigrationPaths.tenant_paths %>
<%%   global_migration_paths = CnfsSupport::EngineMigrationPaths.global_paths %>
<%% else %>
<%%   tenant_migration_paths = ["db/migrate"] %>
<%%   global_migration_paths = ["db/global_migrate"] %>
<%% end %>

default: &default
  adapter: sqlite3
  max_connections: <%%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/tenants/%{tenant}.sqlite3
    tenanted: true
    migrations_paths: <%%= tenant_migration_paths.inspect %>
  global:
    <<: *default
    database: storage/development_global.sqlite3
    migrations_paths: <%%= global_migration_paths.inspect %>

test:
  <<: *default
  database: storage/test.sqlite3

production:
  primary:
    <<: *default
    database: storage/tenants/%{tenant}.sqlite3
    tenanted: true
    migrations_paths: <%%= tenant_migration_paths.inspect %>
  global:
    <<: *default
    database: storage/production_global.sqlite3
    migrations_paths: <%%= global_migration_paths.inspect %>
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
