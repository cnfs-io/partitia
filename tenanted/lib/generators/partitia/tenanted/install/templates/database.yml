# SQLite. Versions 3.8.0 and up are supported.
#
# Multi-tenant layout (partitia-tenanted), in every environment:
#   global : plain, untenanted. The Tenant registry (storage/<env>.sqlite3).
#   tenant : TENANTED. One SQLite file per tenant (storage/<env>/%{tenant}.sqlite3),
#            including the reserved platform database (storage/<env>/platform.sqlite3).
#
# Migrations come from the registry: Partitia::Support.migrations_paths[<scope>]
# is this app's own folder (db/global_migrate, db/migrate) plus the same folder
# of every partitia engine, collected at boot. Nothing is copied into the app.
#
# Migration status of every database, tenants included:
#   bin/rails partitia:tenanted:migrate:status

default: &default
  adapter: sqlite3
  max_connections: <%%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  global:
    <<: *default
    database: storage/development.sqlite3
    migrations_paths: <%%= Partitia::Support.migrations_paths[:global] %>
  tenant:
    <<: *default
    database: storage/development/%{tenant}.sqlite3
    migrations_paths: <%%= Partitia::Support.migrations_paths[:tenant] %>
    tenanted: true

# Warning: The databases defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set them to the same as development or production.
test:
  global:
    <<: *default
    database: storage/test.sqlite3
    migrations_paths: <%%= Partitia::Support.migrations_paths[:global] %>
  tenant:
    <<: *default
    database: storage/test/%{tenant}.sqlite3
    migrations_paths: <%%= Partitia::Support.migrations_paths[:tenant] %>
    tenanted: true

# SQLite writes to the local filesystem: storage/ must be a persistent volume.
production:
  global:
    <<: *default
    database: storage/production.sqlite3
    migrations_paths: <%%= Partitia::Support.migrations_paths[:global] %>
  tenant:
    <<: *default
    database: storage/production/%{tenant}.sqlite3
    migrations_paths: <%%= Partitia::Support.migrations_paths[:tenant] %>
    tenanted: true
<% solid_databases.each do |name| -%>
  <%= name %>:
    <<: *default
    database: storage/production_<%= name %>.sqlite3
    migrations_paths: db/<%= name %>_migrate
<% end -%>
