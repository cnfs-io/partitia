# Dev tooling for the partitia repo (not the gems' runtime: each gem uses its own Ruby).
#
# chrome-devtools-axi: the browser for agents (and people) doing UI work (D7). A CLI over
# Chrome DevTools: open, snapshot (accessibility tree with @uids), click/fill, screenshot,
# console, network. Headless by default, CHROME_DEVTOOLS_AXI_HEADED=1 to watch; use
# CHROME_DEVTOOLS_AXI_SESSION=<name> per agent so parallel agents don't share a browser.
# Needs Google Chrome installed.

[tools]
node = "26"
"npm:chrome-devtools-axi" = "0.1.39"
