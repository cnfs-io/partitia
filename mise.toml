# Dev tooling for the partitia repo (not the gems' runtime: each gem uses its own Ruby).
#
# Playwright drives a real (headless) Chromium for UI work (D7) and, later, a browser-level
# `pt smoke --login`. The MCP server gives an agent the same browser: snapshots,
# screenshots, clicks and forms.
#
# First time:  mise trust && mise install && mise run browsers

[tools]
node = "26"
"npm:playwright" = "1.64.1"
"npm:@playwright/mcp" = "0.0.83"

[tasks.browsers]
description = "Install Playwright's Chromium (into ~/Library/Caches/ms-playwright or ~/.cache/ms-playwright)"
run = "playwright install chromium"
