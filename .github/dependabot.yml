version: 2
updates:
- package-ecosystem: bundler
  directories:
    - "/cognito"
    - "/dev"
    - "/iam"
    - "/support"
    - "/telemetry"
    - "/tenanted"
    - "/ui"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
